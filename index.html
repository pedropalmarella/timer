<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <title>TIMER</title>
</head>

<body>
  <div id="app-container">
    <h1>TIMER'10</h1>
    <div id="timer-container">
      <p id="hours">00</p>:
      <p id="minutes">00</p>:
      <p id="seconds">00</p>:
      <p id="miliseconds">00</p>
    </div>
    <div id="btn-container">
      <button id="increment" onclick="control(1)">Increment</button>
      <button id="decrement" onclick="control(2)">Decrement</button>
      <button id="stop" onclick="control(3)">Stop</button>
      <button id="reset" onclick="control(4)">Reset</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
